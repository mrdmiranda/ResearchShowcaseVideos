<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Video Display</title>

<style>
body {
    margin: 0;
    background: black;
}

.container {
    width: 100vw;
    height: 100vh;
}

.titles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 50px;
    background: black;
    color: white;
    font-size: 32px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    text-align: center;
    align-items: center;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100vw;
    height: calc(100vh - 100px);
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 50px;
    background: black;
    color: white;
    font-size: 28px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    text-align: center;
    align-items: center;
}
</style>

</head>

<body>

<div class="container">

    <!-- Top titles -->
    <div class="titles">
        <div>Baseline</div>
        <div>Optimised</div>
    </div>

    <!-- Videos -->
    <div class="grid">
        <video id="v1" muted playsinline autoplay loop src="Plane1.mp4"></video>
        <video id="v2" muted playsinline autoplay loop src="Plane2.mp4"></video>
        <video id="v3" muted playsinline autoplay loop src="Failure1.mp4"></video>
        <video id="v4" muted playsinline autoplay loop src="Failure2.mp4"></video>
    </div>

    <!-- Bottom values -->
    <div class="bottom">
        <div>Max FI=0.91</div>
        <div>Max FI=0.80</div>
    </div>

</div>


<script>
const videos = document.querySelectorAll("video");

videos.forEach(video => {
    video.muted = true;
    video.loop = true;
    video.playsInline = true;

    video.play().catch(() => {
        document.addEventListener("click", () => {
            video.play();
        }, { once: true });
    });
});
</script>

</body>
</html>
