<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Video Display</title>

<style>
body {
    margin: 0;
    background: black;
}

.container {
    display: grid;
    grid-template-rows: 50px 1fr 50px;
    width: 100vw;
    height: 100vh;
}

.titles, .bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    color: white;
    background: black;
    font-family: Arial, sans-serif;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    align-items: center;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>

</head>

<body>

<div class="container">

    <div class="titles">
        <div>Baseline</div>
        <div>Optimised</div>
    </div>

    <div class="grid">
        <video muted playsinline autoplay loop src="Plane1.mp4"></video>
        <video muted playsinline autoplay loop src="Plane2.mp4"></video>
        <video muted playsinline autoplay loop src="Failure1.mp4"></video>
        <video muted playsinline autoplay loop src="Failure2.mp4"></video>
    </div>

    <div class="bottom">
        <div>Max FI=0.91</div>
        <div>Max FI=0.80</div>
    </div>

</div>

<script>
document.querySelectorAll("video").forEach(video => {
    video.play();
});
</script>

</body>
</html>
