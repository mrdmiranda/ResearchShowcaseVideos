<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Video Display</title>

<style>
body {
    margin: 0;
    background: black;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100vw;
    height: 100vh;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<div class="grid">
    <video id="v1" muted playsinline src="video1.mp4"></video>
    <video id="v2" muted playsinline src="video2.mp4"></video>
    <video id="v3" muted playsinline src="video3.mp4"></video>
    <video id="v4" muted playsinline src="video4.mp4"></video>
</div>

<script>
const videos = [...document.querySelectorAll("video")];

Promise.all(videos.map(v => new Promise(resolve => {
    v.oncanplay = resolve;
}))).then(() => {
    videos.forEach(v => {
        v.currentTime = 0;
        v.play();
    });
});
</script>

</body>
</html>
