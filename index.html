<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Video Display</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    overflow: hidden;
}
.container {
    display: grid;
    grid-template-rows: 50px 1fr 50px;
    width: 100%;
    height: 100%;
}
/* Top labels */
.titles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    align-items: center;
}
/* Video area */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
}
/* Videos */
video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}
/* Bottom labels */
.bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    align-items: center;
}
</style>
</head>
<body>
<div class="container">
    <!-- Column titles -->
    <div class="titles">
        <div>Baseline</div>
        <div>Optimised</div>
    </div>
    <!-- Videos -->
    <div class="grid">
        <video id="v1" muted playsinline autoplay loop preload="auto" src="Plane1.mp4"></video>
        <video id="v2" muted playsinline autoplay loop preload="auto" src="Plane2.mp4"></video>
        <video id="v3" muted playsinline autoplay loop preload="auto" src="Failure1.mp4"></video>
        <video id="v4" muted playsinline autoplay loop preload="auto" src="Failure2.mp4"></video>
    </div>
    <!-- Performance values -->
    <div class="bottom">
        <div>Max FI=0.91</div>
        <div>Max FI=0.80</div>
    </div>
</div>
<script>
const videos = Array.from(document.querySelectorAll("video"));

videos.forEach(video => {
    video.addEventListener("error", () => {
        console.error(video.id, "failed to load:", video.error);
    });
});

/* Wait until all videos are ready */
Promise.all(
    videos.map(video => {
        return new Promise((resolve, reject) => {
            video.addEventListener("canplaythrough", resolve, { once: true });
            video.addEventListener("error", () => reject(new Error(video.id + " failed to load")), { once: true });
            video.load();
        });
    })
).then(() => {
    // Reset all videos
    videos.forEach(video => {
        video.currentTime = 0;
    });
    // Start all videos together
    return Promise.all(videos.map(video => video.play()));
}).then(() => {
    // Hard synchronisation
    setInterval(() => {
        const masterTime = videos[0].currentTime;
        videos.forEach(video => {
            if (Math.abs(video.currentTime - masterTime) > 0.05) {
                video.currentTime = masterTime;
            }
        });
    }, 500);
}).catch(err => {
    console.error("Video setup error:", err);
});
</script>
</body>
</html>
