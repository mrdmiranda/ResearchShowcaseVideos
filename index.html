<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4 Video Display</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    overscroll-behavior: none;
}


/* Main layout */
.container {
    display: flex;
    flex-direction: column;

    height: 100vh;
    height: 100svh;
}


/* Top labels */
.titles {
    flex: 0 0 clamp(32px, 7vh, 50px);

    display: flex;

    background: black;
    color: white;

    font-family: Arial, sans-serif;
    font-size: clamp(14px, 4vw, 28px);
    font-weight: bold;

    text-align: center;
}


.titles div {
    flex: 1;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}



/* Video area */

.grid {

    flex: 1;

    display: flex;
    flex-wrap: wrap;

    overflow: hidden;

    min-height: 0;

    background: black;

    isolation: isolate;
}



/* Individual video cells */

.cell {

    width: 50%;
    height: 50%;

    position: relative;

    overflow: hidden;

    background: black;

    contain: layout paint;
}



/* Videos */

video {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background: black;


    /* Safari rendering fixes */

    transform: translateZ(0);
    -webkit-transform: translateZ(0);

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

}



/* Bottom labels */

.bottom {

    flex: 0 0 clamp(32px, 7vh, 50px);

    display: flex;

    background: black;
    color: white;

    font-family: Arial, sans-serif;
    font-size: clamp(12px, 3.5vw, 24px);
    font-weight: bold;

}


.bottom div {

    flex: 1;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

}

</style>

</head>


<body>


<div class="container">


    <!-- Titles -->

    <div class="titles">

        <div>Baseline</div>

        <div>Optimised</div>

    </div>



    <!-- Videos -->

    <div class="grid">


        <div class="cell">

            <video id="v1"
                muted
                playsinline
                autoplay
                loop
                preload="auto"
                src="Plane1.mp4">
            </video>

        </div>


        <div class="cell">

            <video id="v2"
                muted
                playsinline
                autoplay
                loop
                preload="auto"
                src="Plane2.mp4">
            </video>

        </div>


        <div class="cell">

            <video id="v3"
                muted
                playsinline
                autoplay
                loop
                preload="auto"
                src="Failure1.mp4">
            </video>

        </div>


        <div class="cell">

            <video id="v4"
                muted
                playsinline
                autoplay
                loop
                preload="auto"
                src="Failure2.mp4">
            </video>

        </div>


    </div>



    <!-- Bottom values -->

    <div class="bottom">

        <div>Max FI=0.91</div>

        <div>Max FI=0.80</div>

    </div>


</div>



<script>

const videos = Array.from(
    document.querySelectorAll("video")
);


videos.forEach(video => {

    video.addEventListener("error", () => {

        console.error(video.id, video.error);

    });

});


Promise.all(

    videos.map(video => {

        return new Promise((resolve, reject) => {

            video.addEventListener(
                "canplaythrough",
                resolve,
                { once:true }
            );

            video.addEventListener(
                "error",
                reject,
                { once:true }
            );

            video.load();

        });

    })

)

.then(async()=>{


    videos.forEach(video => {

        video.currentTime = 0;

    });


    await Promise.all(

        videos.map(video =>
            video.play()
        )

    );


    /*
       Soft synchronisation:
       only correct small drift,
       don't constantly seek.
    */

    setInterval(()=>{


        const master =
            videos[0].currentTime;


        videos.forEach(video=>{


            const difference =
                video.currentTime - master;


            if (Math.abs(difference) > 0.25) {


                video.playbackRate =
                    difference > 0
                    ? 0.98
                    : 1.02;


            }
            else {


                video.playbackRate = 1;


            }


        });


    },1000);



})

.catch(error=>{

    console.error(
        "Video setup error:",
        error
    );

});

</script>


</body>
</html>
